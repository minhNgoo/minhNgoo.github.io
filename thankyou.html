<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank you</title>
    <link rel="stylesheet" href="css/lastpage.css" />

    <style>
      /* Floating layer in the background */
      #float-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0; /* behind content */
      }

      /* Keep your page content above the float layer */
      body > *:not(#float-layer) {
        position: relative;
        z-index: 1;
      }

      .float-img {
        position: fixed;
        height: auto;
        opacity: 0.95;
        will-change: transform, opacity;
        animation: floatUp linear forwards;
        user-select: none;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes floatUp {
        from {
          transform: translateY(0) translateX(0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 0.95;
        }
        to {
          transform: translateY(-130vh) translateX(var(--drift)) rotate(var(--rot));
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="thankyou"><b>Thank you</b></div>

    <div id="float-layer"></div>

    <img id="rizz" src="dance.gif" alt="dance mice" class="responsive" />

    <br />
    <audio controls autoplay loop>
      <source src="congratulations.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <h1>Happy valentine's dayyy</h1>

    <script>
      const layer = document.getElementById("float-layer");
      const floatSources = ["mouse_ballon.png", "heart.png"];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function spawnFloat() {
        const el = document.createElement("img");
        el.src = floatSources[Math.floor(Math.random() * floatSources.length)];
        el.className = "float-img";

        // BIGGER sizes
        const size = rand(90, 170);        // px (increase if you want bigger)
        const duration = rand(7, 14);      // seconds
        const drift = `${rand(-90, 90).toFixed(0)}px`;
        const rot = `${rand(-25, 25).toFixed(0)}deg`;

        // Spawn anywhere across the screen
        const x = rand(0, Math.max(0, window.innerWidth - size));

        // Start in the lower half so it floats upward across the screen
        const y = rand(window.innerHeight * 0.55, window.innerHeight + 40);

        el.style.width = `${size}px`;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.animationDuration = `${duration}s`;
        el.style.setProperty("--drift", drift);
        el.style.setProperty("--rot", rot);

        layer.appendChild(el);
        setTimeout(() => el.remove(), (duration + 0.5) * 1000);
      }

      // Spawn a bunch immediately
      for (let i = 0; i < 12; i++) spawnFloat();

      // Keep spawning
      setInterval(spawnFloat, 600);
    </script>
  </body>
</html>
